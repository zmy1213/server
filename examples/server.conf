# Simple teaching config for examples/echo_server.cpp and examples/http_server.cpp.
# Command:
#   ./build/http_server --config examples/server.conf

host = 127.0.0.1
port = 8080
worker_threads = 4
idle_timeout_seconds = 30
backlog = 4096
max_events = 4096

log_level = info
log_console = true
log_file =
